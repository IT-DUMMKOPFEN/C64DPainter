name: Build

# Builds C64 DPainter for Windows, macOS and Linux.
# - Every push and pull request: run the tests and build all programs.
#   The programs can be downloaded under "Artifacts" on the run's page.
# - A release with all files is created in two ways:
#   * push a tag like v0.9b, or
#   * Actions tab -> Build -> "Run workflow" and enter a tag like v0.9b.
# - "Run workflow" with an empty tag just builds the programs.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Create a release with this tag (e.g. v0.9b). Leave empty to only build."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: "1.24"
          cache: false # no go.sum: all dependencies are in third_party

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Pillow (for the macOS icon)
        run: pip install pillow

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l internal cmd)
          if [ -n "$unformatted" ]; then echo "Run gofmt on:"; echo "$unformatted"; exit 1; fi

      - name: Test
        run: go test ./internal/...

      - name: Build all programs
        run: tools/build-all.sh

      - uses: actions/upload-artifact@v6
        with:
          name: C64DPainter-Windows
          path: dist/C64DPainter.exe

      - uses: actions/upload-artifact@v6
        with:
          name: C64DPainter-macOS
          path: dist/C64DPainter-macOS.zip

      - uses: actions/upload-artifact@v6
        with:
          name: C64DPainter-Linux-x86_64
          path: dist/c64dpainter-linux-x86_64.tar.gz

      - uses: actions/upload-artifact@v6
        with:
          name: C64DPainter-Linux-arm64
          path: dist/c64dpainter-linux-arm64.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: C64 DPainter ${{ inputs.release_tag || github.ref_name }}
          prerelease: true
          generate_release_notes: true
          files: dist/*
