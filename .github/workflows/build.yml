name: Build

# Builds C64 DPainter for Windows, macOS and Linux.
# - Every push and pull request: run the tests and build all programs.
#   The programs can be downloaded under "Artifacts" on the run's page.
# - A pushed tag like v0.8b also creates a GitHub release with all files.
# - "Run workflow" on the Actions tab starts a build by hand.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow (for the macOS icon)
        run: pip install pillow

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l internal cmd)
          if [ -n "$unformatted" ]; then echo "Run gofmt on:"; echo "$unformatted"; exit 1; fi

      - name: Test
        run: go test ./internal/...

      - name: Build all programs
        run: tools/build-all.sh

      - uses: actions/upload-artifact@v4
        with:
          name: C64DPainter-Windows
          path: dist/C64DPainter.exe

      - uses: actions/upload-artifact@v4
        with:
          name: C64DPainter-macOS
          path: dist/C64DPainter-macOS.zip

      - uses: actions/upload-artifact@v4
        with:
          name: C64DPainter-Linux-x86_64
          path: dist/c64dpainter-linux-x86_64.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: C64DPainter-Linux-arm64
          path: dist/c64dpainter-linux-arm64.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          name: C64 DPainter ${{ github.ref_name }}
          prerelease: true
          generate_release_notes: true
          files: dist/*
